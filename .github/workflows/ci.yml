# The gates on every push to a branch other than main (verify:ci) and the full set on pull requests to
# main and manual runs (verify; docs/ai/03 §5). Performance is reported, never gated (N1, decision
# 0033), so there is no Lighthouse step. main itself is protected (docs/ai/12 §1).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    # Pinned, not ubuntu-latest: a silent runner upgrade would change font rendering in the e2e runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # CI isn't a Vercel deployment, so it builds as indexable and the SEO gates see a real page.
      # Vercel previews stay noindex whatever this says.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SITE_INDEXING: 'on'
      # The real container (C5): a public ID — it ships in every page's HTML. e2e stubs gtm.js (09 §4),
      # so CI never sends data. The Internal Traffic filter (guide B7) keeps CI's runs out of the reports.
      NEXT_PUBLIC_GTM_ID: GTM-5MR4S8R2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run the gates (verify:ci on branch pushes; the full verify on PRs and manual runs)
        run: npm run ${{ github.event_name == 'push' && 'verify:ci' || 'verify' }}

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
